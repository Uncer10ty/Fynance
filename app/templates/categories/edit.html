{% extends "base.html" %}

{% block title %}Edit {{ category.name }} - Fynance{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('categories.view_category', category_id=category.id) }}" class="text-indigo-600 hover:underline">← Back to Category</a>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Category</h1>
        
        <form method="POST" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Category Name *</label>
                <input type="text" id="name" name="name" required value="{{ category.name }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label for="icon" class="block text-sm font-medium text-gray-700 mb-1">Icon (Emoji)</label>
                <input type="text" id="icon" name="icon" value="{{ category.icon }}" maxlength="4"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                <div class="flex items-center space-x-2">
                    <input type="color" id="color" name="color" value="{{ category.color }}"
                           class="w-12 h-10 border border-gray-300 rounded cursor-pointer">
                    <span class="text-gray-500 text-sm">{{ category.color }}</span>
                </div>
            </div>
            
            <div class="pt-4 flex space-x-4">
                <button type="submit" 
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    Save Changes
                </button>
                <a href="{{ url_for('categories.view_category', category_id=category.id) }}" 
                   class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-lg font-medium transition-colors text-center">
                    Cancel
                </a>
            </div>
        </form>
        
        <div class="mt-8 pt-6 border-t">
            <h3 class="text-sm font-medium text-red-600 mb-2">Danger Zone</h3>
            <form action="{{ url_for('categories.delete_category', category_id=category.id) }}" method="POST"
                  onsubmit="return confirm('Are you sure you want to delete this category?');">
                <button type="submit" 
                        class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-lg font-medium transition-colors">
                    Delete Category
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
