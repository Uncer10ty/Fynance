{% extends "base.html" %}

{% block title %}New Category - Fynance{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('categories.list_categories') }}" class="text-indigo-600 hover:underline">← Back to Categories</a>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Add New Category</h1>
        
        <form method="POST" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Category Name *</label>
                <input type="text" id="name" name="name" required
                       placeholder="e.g., Groceries"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label for="icon" class="block text-sm font-medium text-gray-700 mb-1">Icon (Emoji)</label>
                <input type="text" id="icon" name="icon" value="📁" maxlength="4"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <p class="text-xs text-gray-500 mt-1">Tip: Press Win+. on Windows or Cmd+Ctrl+Space on Mac for emoji picker</p>
            </div>
            
            <div>
                <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                <div class="flex items-center space-x-2">
                    <input type="color" id="color" name="color" value="#9E9E9E"
                           class="w-12 h-10 border border-gray-300 rounded cursor-pointer">
                    <span class="text-gray-500 text-sm">Choose a color for charts</span>
                </div>
            </div>
            
            <div class="pt-4">
                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-lg font-medium transition-colors">
                    Create Category
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
